<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佳里奇美醫院｜護理部特殊作業審查評分系統</title>
<style>
  :root {
    --bg: #F6F4EF;
    --card: #FFFFFF;
    --ink: #2C3A36;
    --ink-soft: #6B7772;
    --line: #E2DED3;
    --sage: #5F7D72;
    --sage-dark: #47615A;
    --sage-tint: #EAF0EC;
    --warn: #B4694B;
    --warn-tint: #F6E9E3;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* 置頂導覽列 */
  .topnav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .topnav .brand { display: flex; flex-direction: column; }
  .topnav .brand .org { font-size: 12px; color: var(--ink-soft); }
  .topnav .brand .title { font-size: 17px; font-weight: 700; }
  .topnav button.nav-login {
    width: auto;
    margin: 0;
    padding: 10px 20px;
    font-size: 14px;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }
  main.wide { max-width: 1000px; }

  /* 首頁 hero */
  .hero { padding: 8px 4px 30px; }
  .hero .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--sage-dark);
    text-transform: uppercase;
  }
  .hero h1 {
    font-size: 30px;
    margin: 10px 0 6px;
    line-height: 1.35;
  }
  .hero .tagline {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 26px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-card .num { font-size: 26px; font-weight: 700; color: var(--sage-dark); }
  .stat-card .label { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .progress-panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
  }
  .progress-panel .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 700;
  }
  .progress-panel .panel-head .note { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  .judge-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .judge-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    background: #FDFCFA;
  }
  .judge-card .row1 {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .judge-card .row1 .pct { color: var(--sage-dark); }
  .bar-track { height: 6px; background: var(--sage-tint); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--sage); }
  .judge-card .row2 { font-size: 11px; color: var(--ink-soft); margin-top: 6px; }

  .privacy-note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 12px 16px;
    background: #FBF3E3;
    border: 1px solid #EBDFC2;
    border-radius: 8px;
    font-size: 13px;
    color: #8A6D2F;
  }
  .cta-row { margin-top: 26px; text-align: center; }
  .cta-row button { max-width: 260px; margin: 0 auto; }

  /* 卡片與表單元件 */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 32px;
  }
  .card--narrow { max-width: 440px; margin: 0 auto; }
  .card + .card { margin-top: 16px; }
  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"],
  input[type="password"],
  input[type="number"],
  textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #FDFCFA;
    color: var(--ink);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--sage);
    box-shadow: 0 0 0 3px var(--sage-tint);
  }
  textarea { resize: vertical; min-height: 64px; }
  textarea#overall-comment { min-height: 130px; font-size: 15px; }
  button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: var(--sage);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--sage-dark); }
  button:disabled { background: #B9C4BF; cursor: default; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { flex: 1; }
  button.ghost {
    background: transparent;
    color: var(--sage-dark);
    border: 1px solid var(--sage);
  }
  button.ghost:hover { background: var(--sage-tint); }
  .error {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--warn-tint);
    color: var(--warn);
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .error.show { display: block; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .topbar .who { font-size: 14px; color: var(--ink-soft); }
  .topbar .who b { color: var(--ink); }
  .logout {
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    width: auto;
    margin: 0;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--sage-dark);
    letter-spacing: 0.04em;
    margin: 22px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }
  .team-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #FDFCFA;
  }
  .team-item:hover { border-color: var(--sage); }
  .team-item .code { font-size: 15px; font-weight: 600; }
  .team-item .status { font-size: 12px; padding: 3px 9px; border-radius: 20px; }
  .status.pending { background: #EFEAE0; color: var(--ink-soft); }
  .status.draft { background: #F6E9CF; color: #8A6D2F; }
  .status.pass { background: var(--sage-tint); color: var(--sage-dark); }
  .status.fail { background: var(--warn-tint); color: var(--warn); }
  .crit-block {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .crit-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .crit-head .name { font-size: 15px; font-weight: 700; }
  .crit-head .max { font-size: 12px; color: var(--ink-soft); }
  .crit-desc { font-size: 13px; color: var(--ink-soft); white-space: pre-line; line-height: 1.6; margin-bottom: 12px; }
  .score-row { display: flex; gap: 10px; align-items: flex-start; }
  .score-row input[type="number"] { max-width: 90px; }
  .score-row textarea.crit-comment { flex: 1; min-height: 60px; font-size: 14px; resize: vertical; }
  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--sage-dark);
    cursor: pointer;
    text-decoration: underline;
  }
  .total-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--sage-tint);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .total-bar b { font-size: 18px; color: var(--sage-dark); }
  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 20px 0; }

  /* 列印評分表 */
  .print-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
  .print-table th, .print-table td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .print-table th { background: var(--sage-tint); color: var(--sage-dark); font-weight: 700; }
  .print-header-table td { border: 1px solid var(--line); padding: 8px 10px; }
  .print-footer-row { display: flex; justify-content: space-between; margin-top: 16px; font-size: 14px; }
  @media print {
    .topnav, .no-print, .back-link { display: none !important; }
    body { background: #fff; }
    main { max-width: 100%; padding: 0; }
    .card { border: none; padding: 0; }
  }

  @media (max-width: 720px) {
    .stat-row { grid-template-columns: 1fr; }
    .judge-grid { grid-template-columns: 1fr 1fr; }
    .topnav { padding: 14px 18px; }
  }
</style>
</head>
<body>

<div class="topnav">
  <div class="brand">
    <span class="org">奇美醫療財團法人 佳里奇美醫院</span>
    <span class="title">護理部特殊作業審查評分系統</span>
  </div>
  <button class="nav-login" id="btn-nav-login">評審登入</button>
</div>

<main>

  <!-- 首頁：公開進度總覽 -->
  <section id="view-home">
    <div class="hero">
      <div class="eyebrow">SPECIAL REPORT REVIEW</div>
      <h1>護理部特殊作業審查評分系統</h1>

      <div class="stat-row">
        <div class="stat-card"><div class="num" id="home-judge-count">–</div><div class="label">評審人數</div></div>
        <div class="stat-card"><div class="num" id="home-overall-pct">–</div><div class="label">整體完成率</div></div>
        <div class="stat-card"><div class="num" id="home-completed">–</div><div class="label">完成評分項目</div></div>
      </div>

      <div class="progress-panel">
        <div class="panel-head">
          <span id="home-panel-title">評審評分進度</span>
          <span class="note">首頁不公開任何分數及評語</span>
        </div>
        <div class="judge-grid" id="judge-grid"><div class="loading">載入中…</div></div>
      </div>

      <div class="privacy-note">🔒 評審登入後只能看到自己的評分資料。</div>

      <div class="cta-row">
        <button id="btn-cta-login">登入評分系統</button>
      </div>
    </div>
  </section>

  <!-- 登入畫面 -->
  <section id="view-login" class="card card--narrow hidden">
    <label for="account">帳號</label>
    <input type="text" id="account" autocomplete="username">
    <label for="password">密碼</label>
    <input type="password" id="password" autocomplete="current-password">
    <div class="error" id="login-error"></div>
    <button id="btn-login">登入</button>
  </section>

  <!-- 受評清單 -->
  <section id="view-list" class="hidden">
    <div class="topbar">
      <span class="who">評審：<b id="who-name"></b></span>
      <button class="logout" id="btn-logout">登出</button>
    </div>
    <div id="list-content"><div class="loading">載入中…</div></div>
  </section>

  <!-- 管理員總覽 -->
  <section id="view-admin" class="hidden">
    <div class="topbar">
      <span class="who">管理員：<b id="admin-who-name"></b></span>
      <button class="logout" id="btn-admin-logout">登出</button>
    </div>
    <div id="admin-content"><div class="loading">載入中…</div></div>
  </section>

  <!-- 列印用評分表 -->
  <section id="view-print" class="hidden">
    <div class="no-print" style="margin-bottom:16px;">
      <span class="back-link" id="btn-print-back">← 返回管理員總覽</span>
      <button id="btn-print-now" style="width:auto;margin:0 0 0 12px;padding:9px 18px;font-size:13px;display:inline-block;">列印 / 另存 PDF</button>
    </div>
    <div id="print-content" class="card"><div class="loading">載入中…</div></div>
  </section>

  <!-- 評分表單 -->
  <section id="view-score" class="hidden">
    <span class="back-link" id="btn-back">← 返回清單</span>
    <div class="card">
      <div class="topbar" style="margin-bottom:0;">
        <span class="who">受評編號：<b id="score-code"></b></span>
      </div>
      <div id="crit-list" style="margin-top:16px;"></div>
      <div class="total-bar">
        <span>目前總分</span>
        <b id="live-total">0</b>
      </div>
      <label for="overall-comment">整體總評</label>
      <textarea id="overall-comment" placeholder="針對整份報告的總結評語"></textarea>
      <div class="error" id="score-error"></div>
      <div class="error" id="score-saved" style="background:var(--sage-tint);color:var(--sage-dark);"></div>
      <div class="btn-row">
        <button id="btn-draft" class="ghost">暫存</button>
        <button id="btn-submit">送出評分</button>
      </div>
    </div>
  </section>

</main>

<script>
// ⚠️ 部署 GAS 網頁應用程式後，把網址貼在這裡
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxqG4skK10OKFXLp5Mvg47JespijeZunrm5S_WMyUzXiw3LRulEBvZ1dVqfZO2JVkot/exec';

let state = {
  token: localStorage.getItem('rs_token') || null,
  judgeName: localStorage.getItem('rs_name') || '',
  role: localStorage.getItem('rs_role') || '',
  teams: [],
  currentTeam: null,
  criteria: [],
};

const $ = (id) => document.getElementById(id);
const VIEWS = ['home', 'login', 'list', 'score', 'admin', 'print'];

function showView(name) {
  VIEWS.forEach(v => {
    $('view-' + v).classList.toggle('hidden', v !== name);
  });
}

function showError(elId, msg) {
  const el = $(elId);
  el.textContent = msg;
  el.classList.add('show');
}
function clearError(elId) {
  $(elId).classList.remove('show');
  $(elId).textContent = '';
}

async function fetchJson_(url, options) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 240000);
  const res = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  clearTimeout(timeout);
  return await res.json(); // 回應不是合法 JSON 時會在這裡丟出 SyntaxError
}

// GAS 網頁應用程式偶爾會在剛部署完/久未使用時，回傳一個轉址用的錯誤頁面而不是
// 正常的 JSON（Google 內部 script.google.com → script.googleusercontent.com 轉址偶爾踩空），
// 這種情況通常重試一次就會恢復正常，所以這裡自動重試一次，不用使用者自己再按一次。
async function withRetry_(fn) {
  try {
    return await fn();
  } catch (err) {
    if (err.name === 'SyntaxError') {
      await new Promise(r => setTimeout(r, 1500));
      return await fn(); // 第二次還是失敗就讓外層 catch 處理
    }
    throw err;
  }
}

async function apiGet(params) {
  try {
    const url = GAS_URL + '?' + new URLSearchParams(params).toString();
    return await withRetry_(() => fetchJson_(url));
  } catch (err) {
    console.error('apiGet 失敗：', err);
    return { success: false, message: errMsg_(err) };
  }
}
async function apiPost(payload) {
  try {
    const options = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免 CORS 預檢
      body: JSON.stringify(payload),
    };
    return await withRetry_(() => fetchJson_(GAS_URL, options));
  } catch (err) {
    console.error('apiPost 失敗：', err);
    return { success: false, message: errMsg_(err) };
  }
}

function errMsg_(err) {
  if (err.name === 'AbortError') return '連線逾時（240秒無回應），請重試';
  if (err.name === 'SyntaxError') return 'Google 伺服器暫時忙線，請稍後再試一次（通常幾秒後就會恢復）';
  return '連線失敗，請確認 GAS_URL 是否正確（詳見瀏覽器 Console）';
}

// ---------------- 首頁進度總覽 ----------------

$('btn-nav-login').addEventListener('click', () => showView('login'));
$('btn-cta-login').addEventListener('click', () => showView('login'));

async function loadHomeProgress() {
  const resp = await apiGet({ action: 'getProgress' });
  if (!resp.success) {
    $('judge-grid').innerHTML = `<div class="loading">${resp.message || '進度資料載入失敗'}</div>`;
    return;
  }
  $('home-judge-count').textContent = resp.judgeCount;
  $('home-overall-pct').textContent = resp.overallPercent + '%';
  $('home-completed').textContent = `${resp.completedCount} / ${resp.totalAssignments}`;
  $('home-panel-title').textContent = `${resp.judgeCount} 位評審評分進度`;

  $('judge-grid').innerHTML = resp.perJudge.map(j => `
    <div class="judge-card">
      <div class="row1"><span>${j.name}</span><span class="pct">${j.percent}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${j.percent}%"></div></div>
      <div class="row2">完成 ${j.completed} ｜ 未評 ${j.pending}</div>
    </div>
  `).join('') || '<div class="loading">尚無評審資料</div>';
}

// ---------------- 登入 ----------------

$('btn-login').addEventListener('click', async () => {
  clearError('login-error');
  const account = $('account').value.trim();
  const password = $('password').value;
  if (!account || !password) {
    showError('login-error', '請輸入帳號與密碼');
    return;
  }
  $('btn-login').disabled = true;
  $('btn-login').textContent = '登入中…';
  const resp = await apiPost({ action: 'login', account, password });
  $('btn-login').disabled = false;
  $('btn-login').textContent = '登入';

  if (!resp.success) {
    showError('login-error', resp.message || '登入失敗');
    return;
  }
  state.token = resp.token;
  state.judgeName = resp.judgeName;
  state.role = resp.role;
  localStorage.setItem('rs_token', resp.token);
  localStorage.setItem('rs_name', resp.judgeName);
  localStorage.setItem('rs_role', resp.role);
  if (resp.role === '管理員') {
    enterAdmin();
  } else {
    enterList();
  }
});

$('btn-admin-logout').addEventListener('click', () => {
  state.token = null;
  localStorage.removeItem('rs_token');
  localStorage.removeItem('rs_name');
  localStorage.removeItem('rs_role');
  showView('home');
  loadHomeProgress();
});

$('btn-logout').addEventListener('click', () => {
  state.token = null;
  localStorage.removeItem('rs_token');
  localStorage.removeItem('rs_name');
  localStorage.removeItem('rs_role');
  showView('home');
  loadHomeProgress();
});

// ---------------- 受評清單 ----------------

async function enterList() {
  $('who-name').textContent = state.judgeName;
  showView('list');
  $('list-content').innerHTML = '<div class="loading">載入中…</div>';

  const resp = await apiGet({ action: 'getTeams', token: state.token });
  if (!resp.success) {
    showView('login');
    showError('login-error', resp.message || '登入已過期，請重新登入');
    return;
  }
  state.teams = resp.teams;
  renderList();
}

function renderList() {
  const groups = {};
  state.teams.forEach(t => {
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });

  let html = '';
  Object.keys(groups).forEach(cat => {
    html += `<div class="section-title">${cat}</div>`;
    groups[cat].forEach(t => {
      let statusClass = 'pending', statusText = '尚未評分';
      if (t.status === 'draft') {
        statusClass = 'draft';
        statusText = '已暫存';
      } else if (t.status === 'done') {
        statusClass = t.decision === '通過' ? 'pass' : 'fail';
        statusText = `${t.decision}（${t.totalScore}分）`;
      }
      html += `
        <div class="team-item" data-team-id="${t.teamId}">
          <span class="code">${t.anonCode}</span>
          <span class="status ${statusClass}">${statusText}</span>
        </div>`;
    });
  });
  $('list-content').innerHTML = html || '<div class="loading">目前沒有受評項目</div>';

  document.querySelectorAll('.team-item').forEach(el => {
    el.addEventListener('click', () => openScoreForm(el.dataset.teamId));
  });
}

// ---------------- 評分表單 ----------------

$('btn-back').addEventListener('click', () => showView('list'));

async function openScoreForm(teamId) {
  const team = state.teams.find(t => t.teamId === teamId);
  state.currentTeam = team;
  showView('score');
  $('score-code').textContent = team.anonCode;
  $('crit-list').innerHTML = '<div class="loading">載入評分項目…</div>';
  clearError('score-error');
  $('score-saved').classList.remove('show');

  let critResp, myResp;
  try {
    [critResp, myResp] = await Promise.all([
      apiGet({ action: 'getCriteria', category: team.category }),
      apiGet({ action: 'getMyReview', token: state.token, teamId }),
    ]);
  } catch (err) {
    console.error('載入評分項目失敗：', err);
    $('crit-list').innerHTML = '';
    showError('score-error', '載入評分項目時發生錯誤，請重新整理再試一次');
    return;
  }

  if (!critResp.success) {
    $('crit-list').innerHTML = '';
    showError('score-error', critResp.message || '讀取評分項目失敗');
    return;
  }
  state.criteria = critResp.criteria;

  if (state.criteria.length === 0) {
    $('crit-list').innerHTML = '';
    showError('score-error', `類別「${team.category}」在 Criteria 分頁找不到對應的評分項目，請確認 Teams 的類別欄位跟 Criteria 的類別欄位文字完全一致`);
    return;
  }

  const prevScores = {};
  if (myResp.success) {
    (myResp.scores || []).forEach(s => { prevScores[s.criteriaId] = s; });
  }

  $('crit-list').innerHTML = state.criteria.map(c => {
    const prev = prevScores[c.criteriaId];
    return `
      <div class="crit-block" data-criteria-id="${c.criteriaId}" data-max="${c.maxPoints}">
        <div class="crit-head">
          <span class="name">${c.name}</span>
          <span class="max">滿分 ${c.maxPoints}</span>
        </div>
        <div class="crit-desc">${c.description}</div>
        <div class="score-row">
          <input type="number" class="crit-score" min="0" max="${c.maxPoints}"
                 value="${prev ? prev.score : ''}" placeholder="0-${c.maxPoints}">
          <textarea class="crit-comment" rows="2" placeholder="評語（可選填）">${prev ? (prev.comment || '') : ''}</textarea>
        </div>
      </div>`;
  }).join('');

  $('overall-comment').value = (myResp.success && myResp.overallComment) || '';

  document.querySelectorAll('.crit-score').forEach(inp => {
    inp.addEventListener('input', updateLiveTotal);
  });
  updateLiveTotal();
}

function updateLiveTotal() {
  let total = 0;
  document.querySelectorAll('.crit-block').forEach(block => {
    const v = Number(block.querySelector('.crit-score').value);
    if (!isNaN(v)) total += v;
  });
  $('live-total').textContent = total;
}

$('btn-submit').addEventListener('click', async () => {
  clearError('score-error');
  $('score-saved').classList.remove('show');
  const blocks = document.querySelectorAll('.crit-block');
  const scores = [];
  for (const block of blocks) {
    const criteriaId = block.dataset.criteriaId;
    const max = Number(block.dataset.max);
    const scoreInput = block.querySelector('.crit-score');
    const commentInput = block.querySelector('.crit-comment');
    const score = Number(scoreInput.value);
    if (scoreInput.value === '' || isNaN(score) || score < 0 || score > max) {
      showError('score-error', `「${block.querySelector('.name').textContent}」請填 0～${max} 分`);
      return;
    }
    scores.push({ criteriaId, score, comment: commentInput.value.trim() });
  }

  $('btn-submit').disabled = true;
  const resp = await apiPost({
    action: 'submitScore',
    token: state.token,
    teamId: state.currentTeam.teamId,
    scores,
    overallComment: $('overall-comment').value.trim(),
  });
  $('btn-submit').disabled = false;

  if (!resp.success) {
    showError('score-error', resp.message || '送出失敗，請再試一次');
    return;
  }
  await enterList(); // 回清單並刷新狀態
});

$('btn-draft').addEventListener('click', async () => {
  clearError('score-error');
  $('score-saved').classList.remove('show');
  const blocks = document.querySelectorAll('.crit-block');
  const scores = [];
  for (const block of blocks) {
    const criteriaId = block.dataset.criteriaId;
    const max = Number(block.dataset.max);
    const scoreInput = block.querySelector('.crit-score');
    const commentInput = block.querySelector('.crit-comment');
    if (scoreInput.value === '') continue; // 暫存允許留空，跳過未填的項目

    const score = Number(scoreInput.value);
    if (isNaN(score) || score < 0 || score > max) {
      showError('score-error', `「${block.querySelector('.name').textContent}」請填 0～${max} 分，或留空`);
      return;
    }
    scores.push({ criteriaId, score, comment: commentInput.value.trim() });
  }

  $('btn-draft').disabled = true;
  $('btn-draft').textContent = '暫存中…';
  const resp = await apiPost({
    action: 'saveDraft',
    token: state.token,
    teamId: state.currentTeam.teamId,
    scores,
    overallComment: $('overall-comment').value.trim(),
  });
  $('btn-draft').disabled = false;
  $('btn-draft').textContent = '暫存';

  if (!resp.success) {
    showError('score-error', resp.message || '暫存失敗，請再試一次');
    return;
  }
  const saved = $('score-saved');
  saved.textContent = '已暫存，可以先離開，之後再回來繼續填';
  saved.classList.add('show');
});

// ---------------- 管理員總覽 ----------------

async function enterAdmin() {
  $('admin-who-name').textContent = state.judgeName;
  showView('admin');
  $('admin-content').innerHTML = '<div class="loading">載入中…</div>';

  const resp = await apiGet({ action: 'getAdminOverview', token: state.token });
  if (!resp.success) {
    showView('login');
    showError('login-error', resp.message || '登入已過期，請重新登入');
    return;
  }
  renderAdmin(resp.teams);
}

function renderAdmin(teams) {
  const groups = {};
  teams.forEach(t => {
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });

  let html = '';
  Object.keys(groups).forEach(cat => {
    html += `<div class="section-title">${cat}</div>`;
    groups[cat].forEach(t => {
      html += `<div class="card" style="padding:16px 20px;margin-bottom:10px;">
        <div style="font-weight:700;font-size:15px;margin-bottom:2px;">${t.name}　<span style="color:var(--ink-soft);font-weight:400;font-size:13px;">（${t.anonCode}）</span></div>`;
      if (t.judges.length === 0) {
        html += `<div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">尚未指派評審</div>`;
      } else {
        t.judges.forEach(j => {
          let statusText = '尚未評分', statusClass = 'pending';
          if (j.status === 'draft') { statusText = '已暫存'; statusClass = 'draft'; }
          if (j.status === 'done') {
            statusText = `${j.decision}（${j.totalScore}分）`;
            statusClass = j.decision === '通過' ? 'pass' : 'fail';
          }

          let action = `<span style="font-size:12px;color:var(--ink-soft);">尚無資料</span>`;
          if (j.status === 'done') {
            action = `<button class="btn-print" data-judge-id="${j.judgeId}" data-team-id="${t.teamId}" style="width:auto;margin:0;padding:6px 14px;font-size:13px;">列印評分表</button>`;
          }

          html += `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);">
              <span style="font-size:14px;">${j.judgeName}　<span class="status ${statusClass}">${statusText}</span></span>
              ${action}
            </div>`;
        });
      }
      html += `</div>`;
    });
  });
  $('admin-content').innerHTML = html || '<div class="loading">目前沒有受評項目</div>';

  document.querySelectorAll('.btn-print').forEach(btn => {
    btn.addEventListener('click', () => openPrintView(btn.dataset.judgeId, btn.dataset.teamId));
  });
}

$('btn-print-back').addEventListener('click', () => showView('admin'));
$('btn-print-now').addEventListener('click', () => window.print());

async function openPrintView(judgeId, teamId) {
  showView('print');
  $('print-content').innerHTML = '<div class="loading">載入中…</div>';

  const resp = await apiGet({ action: 'getReviewDetail', token: state.token, judgeId, teamId });
  if (!resp.success) {
    $('print-content').innerHTML = `<div class="loading">${resp.message || '載入失敗'}</div>`;
    return;
  }

  const rows = resp.criteria.map(c => `
    <tr>
      <td style="font-weight:600;">${c.name}</td>
      <td style="white-space:pre-line;color:var(--ink-soft);">${c.description}</td>
      <td style="text-align:center;">${c.maxPoints}</td>
      <td style="text-align:center;font-weight:700;">${c.score === null ? '-' : c.score}</td>
      <td>${c.comment || ''}</td>
    </tr>`).join('');

  $('print-content').innerHTML = `
    <h2 style="margin:0 0 4px;">${resp.category}評分表</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 16px;">評審登入評分系統</p>
    <table class="print-header-table" style="width:100%;border-collapse:collapse;">
      <tr><td style="width:120px;font-weight:700;background:var(--sage-tint);">受評編號</td><td>${resp.anonCode}</td></tr>
      <tr><td style="font-weight:700;background:var(--sage-tint);">姓名/隊伍名稱</td><td>${resp.name}</td></tr>
      <tr><td style="font-weight:700;background:var(--sage-tint);">評審</td><td>${resp.judgeName}</td></tr>
    </table>
    <table class="print-table">
      <thead><tr><th>項目</th><th>內容說明（細項）</th><th>配分</th><th>評分</th><th>評語</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="print-footer-row">
      <span><b>總分：</b>${resp.totalScore}</span>
      <span><b>審查決議：</b>${resp.decision}</span>
      <span><b>評分日期：</b>${resp.reviewDate}</span>
    </div>
    <div style="margin-top:16px;">
      <b>整體總評：</b>
      <p style="white-space:pre-line;margin-top:6px;">${resp.overallComment || '（無）'}</p>
    </div>
  `;
}

// ---------------- 初始化 ----------------

if (state.token && state.role === '管理員') {
  enterAdmin();
} else if (state.token) {
  enterList();
} else {
  showView('home');
  loadHomeProgress();
}
</script>
